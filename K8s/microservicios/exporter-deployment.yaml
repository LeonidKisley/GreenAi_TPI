apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenai-exporter
  namespace: microservicios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greenai-exporter
  template:
    metadata:
      labels:
        app: greenai-exporter
    spec:
      containers:
      - name: exporter
        image: greenai-exporter:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DB_HOST
          value: "db.jpfugpsdhuucmilgysgg.supabase.coo"
        - name: DB_NAME
          value: "postgres"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASS
          value: "Celestesana1214@@@"
        - name: DB_PORT
          value: "5432"
---
apiVersion: v1
kind: Service
metadata:
  name: greenai-exporter-service
  namespace: microservicios
spec:
  type: ClusterIP
  selector:
    app: greenai-exporter
  ports:
    - port: 8000
      targetPort: 8000